
spring.application.name=enterprise-scrum-management

server.port=8081

# Reduce response size for dashboard and task payloads.
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/plain,text/css
server.compression.min-response-size=1024


# =========================================================
# MYSQL
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/enterprise_scrum?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=watermelon


app.delete-default-projects=true

# =========================================================
# JPA
# =========================================================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jpa.open-in-view=false

# Keep database connections available without creating an oversized pool.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# =========================================================
# EMAIL NOTIFICATIONS
# Configure these environment variables to deliver assignment emails.
# =========================================================

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# JWT
# =========================================================

app.jwt.secret=ESM-Enterprise-Scrum-Management-JWT-Secret-Key-2026
app.jwt.expiration=86400000


# =========================================================
# LOGGING
# =========================================================

logging.level.com.example.esm=INFO
